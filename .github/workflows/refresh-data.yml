name: Refresh Numeric Data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These run at 11:45 and 15:15 in Vietnam (UTC+7).
    - cron: "45 4 * * 1-5"
    - cron: "15 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: numeric-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Unit Tests
        run: ./broker.sh tests

      - name: Collect And Calculate
        run: ./broker.sh collect

      - name: Validate ChatGPT Retrieval Layout
        run: ./broker.sh validate_layout --ticker VIC

      - name: Commit Refreshed Data
        if: github.ref == 'refs/heads/main'
        env:
          TZ: Asia/Ho_Chi_Minh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-hub/latest out/data out/cafef_flows out/vietstock_overview out/vietstock_bctt out/macro_factors out/data_hub
          if git diff --cached --quiet; then
            echo "No numeric data changes"
            exit 0
          fi
          git commit -m "Refresh numeric market data $(date +%F-%H%M)"
          git push origin HEAD:main
